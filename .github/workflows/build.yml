name: ShowDesk CI
# Development pushes validate the current source. Build commits publish field tests and updater feeds; stable version tags publish official releases.
permissions:
  contents: read
concurrency:
  group: showdesk-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: ['main', 'beta', 'tauri-migration']
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check

  tauri-shell:
    if: startsWith(github.event.head_commit.message, 'RELEASE Build') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Verify updater version ordering
        shell: bash
        run: |
          node <<'NODE'
          const next=require('./src-tauri/tauri.conf.json').version;
          const previous=['0.1.105','0.1.104','0.1.103','0.1.102','0.1.101','0.1.100','0.1.99','0.1.98','0.1.58','0.1.57','0.1.56','0.1.55','0.1.54','0.1.53','0.1.52','0.1.51','0.1.50','0.1.49','0.1.48','0.1.47','0.1.46','0.1.45','0.1.44','0.1.43','0.1.42','0.1.41','0.1.40','0.1.39','0.1.38','0.1.0-37','0.1.0-36','0.1.0'];
          const parse=v=>{const [core,pre]=v.split('-');return {n:core.split('.').map(Number),pre};};
          const gt=(a,b)=>{a=parse(a);b=parse(b);for(let i=0;i<3;i++){if(a.n[i]!==b.n[i])return a.n[i]>b.n[i];}if(a.pre===undefined&&b.pre!==undefined)return true;if(a.pre!==undefined&&b.pre===undefined)return false;return String(a.pre||'')>String(b.pre||'');};
          for(const old of previous)if(!gt(next,old))throw new Error(`${next} is not newer than ${old}`);
          console.log(`Updater ordering verified: ${next} is newer than ${previous.join(', ')}`);
          NODE
      - name: Prepare native ATEM service
        run: |
          npm run bundle
          node scripts/prepare-tauri-backend.js
      - name: Verify trimmed packaged backend
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='src-tauri/resources/backend';for(const n of ['atem-connection','ws'])if(!fs.existsSync(p+'/node_modules/'+n))throw new Error('Missing runtime dependency '+n);for(const n of ['@tauri-apps/cli','esbuild','postject'])if(fs.existsSync(p+'/node_modules/'+n))throw new Error('Development dependency leaked into packaged backend: '+n);"
          node -e "const fs=require('fs'),path=require('path');let total=0;const walk=p=>{for(const e of fs.readdirSync(p,{withFileTypes:true})){const f=path.join(p,e.name);if(e.isDirectory())walk(f);else total+=fs.statSync(f).size}};walk('src-tauri/resources/backend');console.log('Packaged backend bytes:',total);if(total>150*1024*1024)throw new Error('Packaged backend unexpectedly exceeds 150 MiB');"

      - name: Smoke test native ATEM service
        shell: bash
        env:
          SHOWDESK_NO_OPEN: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            src-tauri/resources/backend/runtime/node.exe src-tauri/resources/backend/src/server.js > native-backend.log 2>&1 &
          else
            src-tauri/resources/backend/runtime/node src-tauri/resources/backend/src/server.js > native-backend.log 2>&1 &
          fi
          SERVICE_PID=$!
          sleep 3
          node -e "const WebSocket=require('ws');const ws=new WebSocket('ws://127.0.0.1:47821/ws');const t=setTimeout(()=>process.exit(1),5000);ws.on('open',()=>{clearTimeout(t);ws.close();process.exit(0)});ws.on('error',()=>process.exit(1))"
          node -e "const http=require('http');const req=http.get('http://127.0.0.1:47822/health',res=>{let b='';res.on('data',c=>b+=c);res.on('end',()=>{const j=JSON.parse(b);process.exit(res.statusCode===200&&j.service==='ShowDesk Viewer'?0:1)})});req.setTimeout(5000,()=>{req.destroy();process.exit(1)});req.on('error',()=>process.exit(1))"
          node -e "const WebSocket=require('ws');const ws=new WebSocket('ws://127.0.0.1:47822/viewer');const t=setTimeout(()=>process.exit(1),5000);ws.on('message',raw=>{const m=JSON.parse(raw.toString());if(m.type==='connection'&&m.status==='waiting'){clearTimeout(t);ws.close();process.exit(0)}});ws.on('error',()=>process.exit(1))"
          kill $SERVICE_PID || true
      - name: Generate native icons from approved ShowDesk artwork
        run: |
          npx tauri icon src-tauri/icons/icon.svg
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/icon.ico
      - name: Build Tauri desktop shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build
      - name: Verify native desktop bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -n "$(find src-tauri/target/release/bundle/nsis -type f -name '*-setup.exe' -print -quit)"
            test -s src-tauri/icons/icon.ico
          else
            APP="src-tauri/target/release/bundle/macos/ShowDesk.app"
            test -d "$APP"
            test -x "$APP/Contents/MacOS/showdesk"
            ! grep -R -q 'The browser is the UI for this beta shell' "$APP/Contents" || exit 1
          fi
      - name: Verify and package native macOS Build059
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="src-tauri/target/release/bundle/macos/ShowDesk.app"
          test -d "$APP"
          PLIST_ICON="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")"
          test -n "$PLIST_ICON"
          case "$PLIST_ICON" in *.icns) ;; *) PLIST_ICON="$PLIST_ICON.icns" ;; esac
          test -s "$APP/Contents/Resources/$PLIST_ICON"
          cmp "$APP/Contents/Resources/$PLIST_ICON" src-tauri/icons/icon.icns
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || true
          DMG="src-tauri/target/release/bundle/dmg/ShowDesk-Beta2-Build059-Native-macOS.dmg"
          rm -f "$DMG"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/ShowDesk.app"
          ln -s /Applications "$STAGE/Applications"
          # hdiutil can transiently report "Resource busy" on hosted macOS runners.
          # Retry creation after clearing any stale ShowDesk disk-image attachment.
          create_dmg() {
            hdiutil create -volname "ShowDesk" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          }
          if ! create_dmg; then
            echo "Initial DMG creation failed; clearing stale disk-image state and retrying..."
            hdiutil info | awk '/^\/dev\// { dev=$1 } /ShowDesk/ && dev { print dev }' | sort -u | while read -r dev; do
              hdiutil detach "$dev" -force || true
            done
            rm -f "$DMG"
            sleep 5
            create_dmg
          fi
          rm -rf "$STAGE"
          MOUNT="$(mktemp -d)"
          # Hosted macOS runners sometimes fail to attach a newly created DMG.
          # Retry only the mount operation, cleaning up after each attempt.
          attached=0
          for attempt in 1 2 3 4 5; do
            if hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"; then
              attached=1
              break
            fi
            echo "DMG mount attempt $attempt failed; clearing stale ShowDesk mounts..."
            hdiutil info | awk '/^\\/dev\\// { dev=$1 } /ShowDesk/ && dev { print dev }' | sort -u | while read -r dev; do
              hdiutil detach "$dev" -force || true
            done
            sleep 5
          done
          if [ "$attached" -ne 1 ]; then
            echo "Unable to mount ShowDesk DMG after five attempts"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$MOUNT/ShowDesk.app"
          hdiutil detach "$MOUNT"
          rmdir "$MOUNT"
          rm -f src-tauri/target/release/bundle/macos/ShowDesk-Beta2-Build059-Native-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" src-tauri/target/release/bundle/macos/ShowDesk-Beta2-Build059-Native-macOS.zip
          rm -rf /tmp/showdesk-verify
          mkdir -p /tmp/showdesk-verify
          ditto -x -k src-tauri/target/release/bundle/macos/ShowDesk-Beta2-Build059-Native-macOS.zip /tmp/showdesk-verify
          codesign --verify --deep --strict --verbose=2 /tmp/showdesk-verify/ShowDesk.app
      - name: Upload native Build059
        uses: actions/upload-artifact@v4
        with:
          name: ShowDesk-Beta2-Build059-Native-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/ShowDesk-Beta2-Build059-Native-macOS.dmg
            src-tauri/target/release/bundle/macos/ShowDesk-Beta2-Build059-Native-macOS.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish-updater:
    permissions:
      contents: write
    if: github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'RELEASE Build')
    needs: tauri-shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaged build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ShowDesk-Beta2-Build059-Native-*
          path: updater-input
          merge-multiple: true
      - name: Prepare signed updater feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-release
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test -n "$APP_VERSION"
          echo "Packaging updater feed for ShowDesk $APP_VERSION"
          MAC_SRC="$(find updater-input -type f -name '*.app.tar.gz' | head -n1)"
          MAC_SIG_SRC="$(find updater-input -type f -name '*.app.tar.gz.sig' | head -n1)"
          WIN_SRC="$(find updater-input -type f -name '*-setup.exe' | head -n1)"
          WIN_SIG_SRC="$(find updater-input -type f -name '*-setup.exe.sig' | head -n1)"
          test -n "$MAC_SRC" && test -n "$MAC_SIG_SRC" && test -n "$WIN_SRC" && test -n "$WIN_SIG_SRC"
          cp "$MAC_SRC" "updater-release/ShowDesk-${APP_VERSION}-macOS-arm64.app.tar.gz"
          cp "$MAC_SIG_SRC" "updater-release/ShowDesk-${APP_VERSION}-macOS-arm64.app.tar.gz.sig"
          cp "$WIN_SRC" "updater-release/ShowDesk-${APP_VERSION}-Windows-x64-setup.exe"
          cp "$WIN_SIG_SRC" "updater-release/ShowDesk-${APP_VERSION}-Windows-x64-setup.exe.sig"
          export APP_VERSION
          node <<'NODE'
          const fs=require('fs');
          const base='https://github.com/DrewL33/ShowDesk/releases/download/showdesk-stable-latest/';
          const feed={
            version:process.env.APP_VERSION,
            notes:'ShowDesk '+process.env.APP_VERSION+' release.',
            pub_date:new Date().toISOString(),
            platforms:{
              'darwin-aarch64':{
                signature:fs.readFileSync(`updater-release/ShowDesk-${process.env.APP_VERSION}-macOS-arm64.app.tar.gz.sig`,'utf8').trim(),
                url:base+`ShowDesk-${process.env.APP_VERSION}-macOS-arm64.app.tar.gz`
              },
              'windows-x86_64':{
                signature:fs.readFileSync(`updater-release/ShowDesk-${process.env.APP_VERSION}-Windows-x64-setup.exe.sig`,'utf8').trim(),
                url:base+`ShowDesk-${process.env.APP_VERSION}-Windows-x64-setup.exe`
              }
            }
          };
          fs.writeFileSync('updater-release/latest.json',JSON.stringify(feed,null,2)+'\n');
          NODE
          node -e "const fs=require('fs');const expected=require('./src-tauri/tauri.conf.json').version;const feed=JSON.parse(fs.readFileSync('updater-release/latest.json','utf8'));if(feed.version!==expected||!feed.platforms?.['darwin-aarch64']||!feed.platforms?.['windows-x86_64'])process.exit(1)"
      - name: Publish stable and legacy updater feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view showdesk-stable-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create showdesk-stable-latest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ShowDesk Stable Updates" --notes "Signed ShowDesk stable updater feed." --prerelease
          fi
          gh release upload showdesk-stable-latest updater-release/* --repo "${{ github.repository }}" --clobber
          if ! gh release view showdesk-beta-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create showdesk-beta-latest --repo "${{ github.repository }}" --title "ShowDesk Beta Latest" --notes "Signed ShowDesk beta updater feed." --prerelease
          fi
          gh release upload showdesk-beta-latest updater-release/latest.json --repo "${{ github.repository }}" --clobber
      - name: Verify published updater feed
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/showdesk-stable-latest/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$URL?run=${{ github.run_id }}&attempt=$attempt" -o published-latest.json; then
              node -e "const fs=require('fs');const expected=require('./src-tauri/tauri.conf.json').version;const feed=JSON.parse(fs.readFileSync('published-latest.json','utf8'));if(feed.version!==expected||!feed.platforms?.['darwin-aarch64']||!feed.platforms?.['windows-x86_64'])process.exit(1)"
              exit 0
            fi
            sleep 3
          done
          exit 1

  publish-official-release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: tauri-shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ShowDesk-Beta2-Build059-Native-*
          path: release-input
          merge-multiple: true
      - name: Prepare customer installers and signed updater assets
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "v$APP_VERSION" = "${GITHUB_REF_NAME}"
          MAC_DMG="$(find release-input -type f -name '*.dmg' | head -n1)"
          WIN_EXE="$(find release-input -type f -name '*-setup.exe' | head -n1)"
          MAC_TAR="$(find release-input -type f -name '*.app.tar.gz' | head -n1)"
          MAC_SIG="$(find release-input -type f -name '*.app.tar.gz.sig' | head -n1)"
          WIN_SIG="$(find release-input -type f -name '*-setup.exe.sig' | head -n1)"
          test -n "$MAC_DMG" && test -n "$WIN_EXE" && test -n "$MAC_TAR" && test -n "$MAC_SIG" && test -n "$WIN_SIG"
          mkdir -p official-release
          cp "$MAC_DMG" official-release/ShowDesk-macOS-Installer.dmg
          cp "$WIN_EXE" official-release/ShowDesk-Windows-Installer.exe
          cp "$MAC_TAR" "official-release/ShowDesk-${APP_VERSION}-macOS-arm64.app.tar.gz"
          cp "$MAC_SIG" "official-release/ShowDesk-${APP_VERSION}-macOS-arm64.app.tar.gz.sig"
          cp "$WIN_EXE" "official-release/ShowDesk-${APP_VERSION}-Windows-x64-setup.exe"
          cp "$WIN_SIG" "official-release/ShowDesk-${APP_VERSION}-Windows-x64-setup.exe.sig"
          export APP_VERSION GITHUB_REF_NAME
          node <<'NODE'
          const fs=require('fs');
          const version=process.env.APP_VERSION;
          const base=`https://github.com/DrewL33/ShowDesk/releases/download/${process.env.GITHUB_REF_NAME}/`;
          const feed={
            version,
            notes:'ShowDesk '+version+' stable release.',
            pub_date:new Date().toISOString(),
            platforms:{
              'darwin-aarch64':{
                signature:fs.readFileSync(`official-release/ShowDesk-${version}-macOS-arm64.app.tar.gz.sig`,'utf8').trim(),
                url:base+`ShowDesk-${version}-macOS-arm64.app.tar.gz`
              },
              'windows-x86_64':{
                signature:fs.readFileSync(`official-release/ShowDesk-${version}-Windows-x64-setup.exe.sig`,'utf8').trim(),
                url:base+`ShowDesk-${version}-Windows-x64-setup.exe`
              }
            }
          };
          fs.writeFileSync('official-release/latest.json',JSON.stringify(feed,null,2)+'\n');
          NODE
      - name: Publish official GitHub release and updater channels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ShowDesk $APP_VERSION" --notes-file RELEASE_NOTES.md --latest
          else
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "ShowDesk $APP_VERSION" --notes-file RELEASE_NOTES.md --latest
          fi
          gh release upload "$TAG" official-release/* --repo "${{ github.repository }}" --clobber
          if ! gh release view showdesk-stable-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create showdesk-stable-latest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ShowDesk Stable Updates" --notes "Signed ShowDesk stable updater feed." --prerelease
          fi
          gh release upload showdesk-stable-latest official-release/ShowDesk-*-macOS-arm64.app.tar.gz official-release/ShowDesk-*-macOS-arm64.app.tar.gz.sig official-release/ShowDesk-*-Windows-x64-setup.exe official-release/ShowDesk-*-Windows-x64-setup.exe.sig official-release/latest.json --repo "${{ github.repository }}" --clobber
          if gh release view showdesk-beta-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload showdesk-beta-latest official-release/latest.json --repo "${{ github.repository }}" --clobber
          fi
      - name: Verify official downloads and stable updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft')" = "false"
          gh api "repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[].name' | sort > published-assets.txt
          grep -qx 'ShowDesk-macOS-Installer.dmg' published-assets.txt
          grep -qx 'ShowDesk-Windows-Installer.exe' published-assets.txt
          curl -fL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://github.com/${{ github.repository }}/releases/download/showdesk-stable-latest/latest.json" -o published-latest.json
          node -e "const f=JSON.parse(require('fs').readFileSync('published-latest.json','utf8'));if(f.version!==require('./src-tauri/tauri.conf.json').version||!f.platforms?.['darwin-aarch64']||!f.platforms?.['windows-x86_64'])process.exit(1)"

  publish-field-test:
    permissions:
      contents: write
    if: github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'RELEASE Build')
    needs: tauri-shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ShowDesk-Beta2-Build059-Native-*
          path: field-test-input
          merge-multiple: true
      - name: Prepare two-file field-test release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p field-test-release
          MAC_DMG="$(find field-test-input -type f -name '*.dmg' | head -n1)"
          WIN_EXE="$(find field-test-input -type f -name '*-setup.exe' | head -n1)"
          test -n "$MAC_DMG" && test -n "$WIN_EXE"
          cp "$MAC_DMG" field-test-release/ShowDesk-macOS-Installer.dmg
          cp "$WIN_EXE" field-test-release/ShowDesk-Windows-Installer.exe
          test "$(find field-test-release -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
      - name: Publish clean field-test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="showdesk-field-test"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ShowDesk — Field Test" --notes "Current ShowDesk field-test installers. Choose the installer for your operating system." --prerelease
          fi
          gh release upload "$TAG" field-test-release/ShowDesk-macOS-Installer.dmg field-test-release/ShowDesk-Windows-Installer.exe --repo "${{ github.repository }}" --clobber
      - name: Verify exactly two tester downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="showdesk-field-test"
          COUNT="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets | length')"
          test "$COUNT" = "2"
          test "$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets | map(.name) | sort | join(",")')" = "ShowDesk-Windows-Installer.exe,ShowDesk-macOS-Installer.dmg"
