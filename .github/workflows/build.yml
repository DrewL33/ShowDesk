name: Build ShowDesk
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: ShowDesk-macOS-arm64
          - os: windows-latest
            artifact: ShowDesk-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run bundle
      - name: Stage packaged ATEM runtime
        shell: bash
        run: |
          mkdir -p dist/node_modules
          cp -R node_modules/atem-connection dist/node_modules/
          cp -R node_modules/@julusian dist/node_modules/@julusian
          cp -R node_modules/eventemitter3 dist/node_modules/ 2>/dev/null || true
          cp -R node_modules/exit-hook dist/node_modules/ 2>/dev/null || true
          cp -R node_modules/p-timeout dist/node_modules/ 2>/dev/null || true
          cp -R node_modules/threadedclass dist/node_modules/ 2>/dev/null || true
      - run: node scripts/make-sea-config.js
      - run: node --experimental-sea-config dist/sea-config.json
      - name: Create SEA executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node -e "require('fs').copyFileSync(process.execPath, 'dist/ShowDesk.exe')"
            npx postject dist/ShowDesk.exe NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          else
            cp "$(command -v node)" dist/ShowDesk
            if [ "$RUNNER_OS" = "macOS" ]; then
              codesign --remove-signature dist/ShowDesk || true
              npx postject dist/ShowDesk NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
            else
              npx postject dist/ShowDesk NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
            fi
          fi
      - name: Ad-hoc sign macOS build
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/ShowDesk
      - name: Smoke test packaged executable
        shell: bash
        env:
          SHOWDESK_NO_OPEN: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/ShowDesk.exe > dist/smoke.log 2>&1 &
            APP_PID=$!
          else
            ./dist/ShowDesk > dist/smoke.log 2>&1 &
            APP_PID=$!
          fi
          sleep 3
          if ! curl --fail --silent --show-error http://127.0.0.1:47821/ > dist/smoke-index.html; then
            echo "----- ShowDesk smoke log -----"
            cat dist/smoke.log || true
            exit 1
          fi
          grep -q "SHOWDESK" dist/smoke-index.html
          node -e "const WebSocket=require('ws'); const ws=new WebSocket('ws://127.0.0.1:47821/ws'); const timer=setTimeout(()=>{console.error('ATEM module smoke test timed out');process.exit(1)},12000); ws.on('open',()=>ws.send(JSON.stringify({id:'smoke-connect',type:'connect',ip:'127.0.0.1'}))); ws.on('message',d=>{const m=JSON.parse(d); if(m.replyTo!=='smoke-connect')return; clearTimeout(timer); if(/constructor|freetype|binding|module loaded/i.test(m.error||'')){console.error(m.error);process.exit(1)} process.exit(0)}); ws.on('error',e=>{console.error(e);process.exit(1)})"
          kill $APP_PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/ShowDesk
            dist/ShowDesk.exe
            dist/node_modules
          if-no-files-found: error
