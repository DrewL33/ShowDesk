name: Build ShowDesk
on:
  workflow_dispatch:
  push:
    branches: ['main', 'beta']
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: ShowDesk-Beta2-Build003-macOS-arm64
          - os: windows-latest
            artifact: ShowDesk-Beta2-Build003-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - name: Validate browser connection wiring
        shell: bash
        run: |
          grep -q 'onclick="connectAtem()"' public/index.html
          grep -q 'window.__showDeskConnectInvoked' public/index.html
          grep -q 'transport.connect(ip)' public/index.html
          grep -q 'class="matrixViewport"><div class="matrix" id="routingMatrix"' public/index.html
      - name: Parse inline application JavaScript
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const open = '<script>';
          const close = '</script>';
          const scripts = [];
          let pos = 0;
          while ((pos = html.indexOf(open, pos)) !== -1) {
            const from = pos + open.length;
            const to = html.indexOf(close, from);
            if (to === -1) throw new Error('Unclosed inline script tag');
            scripts.push(html.slice(from, to));
            pos = to + close.length;
          }
          if (!scripts.length) throw new Error('No inline application JavaScript found');
          scripts.forEach((source, i) => {
            try { new Function(source); }
            catch (error) { throw new Error('Inline script ' + (i + 1) + ' failed to parse: ' + error.message); }
          });
          console.log('Validated ' + scripts.length + ' inline application script(s)');
          NODE
      - run: npm run bundle

      - name: Package Node runtime
        shell: bash
        run: |
          mkdir -p dist/runtime
          node -e "require('fs').copyFileSync(process.execPath, process.platform === 'win32' ? 'dist/runtime/node.exe' : 'dist/runtime/node')"
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x dist/runtime/node; fi

      - name: Create launchers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > dist/ShowDesk.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          runtime\node.exe src\server.js
          EOF
          else
            cat > dist/ShowDesk <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")"
          exec ./runtime/node ./src/server.js
          EOF
            chmod +x dist/ShowDesk
          fi

      - name: Smoke test packaged runtime
        shell: bash
        env:
          SHOWDESK_NO_OPEN: '1'
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./runtime/node.exe src/server.js > smoke.log 2>&1 &
          else
            ./runtime/node src/server.js > smoke.log 2>&1 &
          fi
          APP_PID=$!
          sleep 3
          if ! curl --fail --silent --show-error http://127.0.0.1:47821/ > smoke-index.html; then
            cat smoke.log || true
            exit 1
          fi
          grep -q "SHOWDESK" smoke-index.html
          ../node_modules/.bin/node -e "" 2>/dev/null || true
          node -e "const WebSocket=require('../node_modules/ws'); const ws=new WebSocket('ws://127.0.0.1:47821/ws'); const timer=setTimeout(()=>{console.error('ATEM runtime smoke test timed out');process.exit(1)},12000); ws.on('open',()=>ws.send(JSON.stringify({id:'smoke-connect',type:'connect',ip:'127.0.0.1'}))); ws.on('message',d=>{const m=JSON.parse(d); if(m.replyTo!=='smoke-connect')return; clearTimeout(timer); const e=m.error||''; if(/constructor|freetype|binding|module loaded|packaged ATEM runtime|No such built-in module|Cannot find module/i.test(e)){console.error(e);process.exit(1)} process.exit(0)}); ws.on('error',e=>{console.error(e);process.exit(1)})"
          kill $APP_PID || true

      - name: Create distribution archive
        shell: bash
        run: |
          rm -f dist/smoke.log dist/smoke-index.html
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist\* -DestinationPath ShowDesk-Beta2-Build003-Windows-x64.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent dist ShowDesk-Beta2-Build003-macOS-arm64.zip
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ShowDesk-*.zip
          if-no-files-found: error
