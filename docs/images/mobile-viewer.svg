<svg xmlns="http://www.w3.org/2000/svg" width="420" height="880" viewBox="0 0 420 880" role="img" aria-labelledby="title desc"><title id="title">ShowDesk mobile Viewer</title><desc id="desc">Sample phone layout with Show, Signal, and Inspect tabs and live program and preview information.</desc><defs><style>.u{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8eef0}.m{fill:#92a2aa}.lab{font-size:10px;font-weight:800;letter-spacing:1.2px}.sm{font-size:9px;font-weight:750;letter-spacing:.45px}.body{font-size:13px;font-weight:700}.small{font-size:10px;font-weight:600}.panel{fill:#172127;stroke:#31434c}.card{fill:#202e35;stroke:#344951}</style></defs><rect width="420" height="880" fill="#0e171c"/><rect width="420" height="68" fill="#121c21"/><text x="20" y="30" class="u lab">SHOWDESK</text><text x="20" y="50" class="u small m">ATEM TELEVISION STUDIO HD8</text><rect x="331" y="22" width="70" height="26" rx="13" fill="#183124" stroke="#37654a"/><circle cx="344" cy="35" r="3" fill="#83d39b"/><text x="353" y="39" class="u sm" fill="#96dfae">LIVE</text>
