<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">ShowDesk Inspect</title><desc id="desc">Sample diagnostics including source inventory, routing summary, M/E buses, keyers, and connection status.</desc><defs><style>.u{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8eef0}.m{fill:#87969e}.lab{font-size:11px;font-weight:800;letter-spacing:1.5px}.sm{font-size:10px;font-weight:700;letter-spacing:.45px}.body{font-size:12px;font-weight:650}.panel{fill:#171f24;stroke:#34434b}.cell{fill:#202a30;stroke:#34434b}.ok{fill:#88d5a4}.line{stroke:#34434b}</style></defs><rect width="1440" height="900" fill="#10171b"/><rect width="1440" height="72" fill="#11171b"/><path d="M0 71H1440" class="line"/><rect x="524" y="13" width="392" height="46" rx="22" fill="#1b2429" stroke="#36434a"/><text x="592" y="41" text-anchor="middle" class="u sm m">SHOW VIEW</text><text x="720" y="41" text-anchor="middle" class="u sm m">SIGNAL EXPLORER</text><rect x="790" y="18" width="120" height="36" rx="15" fill="#347cde"/><text x="850" y="41" text-anchor="middle" class="u sm">INSPECT</text><text x="30" y="110" class="u lab">INSPECT WORKSPACE</text><text x="30" y="135" class="u sm m">Surface exceptions and changes first; use live detail to trace the cause.</text>
